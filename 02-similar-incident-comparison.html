   }throw Error('Unterminated string.');

  }

   while(pos<text.length){out.push(value(depth+1));ws();const sep=text[pos++];if(sep===']')return out;if(sep!==',')throw Error('Expected comma.');ws();if(text[pos]===']'){pos++;return out;}}
  }

'use strict';

const TOOLS={details:'get_incident_details__copy',similar:'search_similar_records',modify:'modify_incident'};
const PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
const $=id=>document.getElementById(id);
const S={connected:false,busy:false,view:LANDING,incident:null,source:null,records:null,input:{},selected:new Set(),details:new Map(),draft:{kind:'comments',text:''},review:null,receipt:null,writeLocks:new Set()};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function show(v){return v&&typeof v==='object'?(v.display_value||'Not specified'):(v===0?'0':v||'Not specified');}
function fail(e){$('error').textContent=e.message||String(e);$('status').textContent='';}
function validNumber(n){if(!/^INC\d+$/.test(n||''))throw Error('An exact incident number is required.');return n;}
function button(label,fn,primary=false,disabled=false){const b=node('button',label,primary?'primary':'');b.disabled=disabled||S.busy||!S.connected;b.onclick=fn;return b;}
function disclosure(parent,title,text){const d=node('details');d.append(node('summary',title),node('p',show(text)));parent.append(d);}
function facts(parent,pairs){const g=node('div',undefined,'grid');for(const[k,v]of pairs){const f=node('div',undefined,'fact');f.append(node('small',k),node('strong',show(v)));g.append(f);}parent.append(g);}
function status(text){$('status').textContent=text;}
function cleanText(t){return String(t).replace(/\b[0-9a-f]{32}\b/gi,'[internal identifier]');}
function extract(r){if(r?.isError)throw Error(cleanText(r.content?.filter(p=>p.type==='text').map(p=>p.text).join('\n')||'The tool returned an error.'));let d=r?.structuredContent;if(d==null)for(const p of r?.content??[]){if(p.type==='text')try{d=parseData(p.text);break;}catch{}}if(d==null)d=r;for(let i=0;i<8;i++){if(typeof d==='string')d=parseData(d);else if(d?.result!==undefined)d=d.result;else break;}if(d?.success===false||d?.error)throw Error(cleanText(d.message||d.error?.message||d.error||'The request was rejected.'));return d;}
function remember(i,source=false){validNumber(i.number);S.details.set(i.number,i);S.incident=i;if(source||!S.source)S.source=i;}
function sameIncident(i){return S.incident?.number===i?.number;}
function navigation(){const n=$('nav');n.replaceChildren();for(const [v,label,enabled]of [['overview','1 · Incident',!!S.incident],['related','2 · Compare reports',S.records!==null],['action','3 · Prepare update',!!S.incident],['receipt','Update response',!!S.receipt]]){if(!enabled)continue;const b=button(label,()=>{S.view=v;S.review=null;render();});if(S.view===v)b.setAttribute('aria-current','page');n.append(b);}}
function render(){navigation();const p=$('panel');p.replaceChildren();if(S.view==='overview')overview(p);else if(S.view==='related')related(p);else if(S.view==='action')actionForm(p);else if(S.view==='receipt')receipt(p);}
function overview(p){const i=S.incident;if(!i){p.append(node('h1','Incident workspace'),node('p','Run the incident-details tool to load a record.','muted'));return;}p.append(node('h1',i.short_description||i.number));const b=node('div',undefined,'row');b.append(node('strong',i.number),node('span',show(i.priority),'badge critical'),node('span',show(i.state),'badge'));p.append(b);facts(p,[['Assigned team',i.assignment_group],['Assigned to',i.assigned_to],['Caller',i.caller_id],['Category',i.category],['Configuration item',i.cmdb_ci],['Opened at · source value',i.opened_at]]);p.append(node('h2','Reported symptoms'),node('p',i.description||'No additional description recorded.'));disclosure(p,'Recent comments and work notes',i.activity?.trim()||'No activity returned.');disclosure(p,'Resolution notes',i.close_notes||'No resolution notes recorded.');const a=node('div',undefined,'actions');a.append(button('Find similar reports',search,true),button('Prepare update',()=>{S.view='action';S.draft={kind:'comments',text:''};S.review=null;render();}),button('Refresh',()=>load(i.number)));if(S.source&&S.source.number!==i.number)a.append(button('Return to '+S.source.number,()=>{S.incident=S.source;render();}));p.append(a);}
async function work(fn,label='Loading evidence…'){if(S.busy)return;S.busy=true;$('error').textContent='';status(label);render();try{await fn();status(PREVIEW?'Preview data · no live requests':'Evidence loaded');}catch(e){fail(e);}finally{S.busy=false;render();}}
async function tool(name,args){if(PREVIEW)return mock(name,args);if(!S.connected)throw Error('MCP host connection is not ready.');return rpc('tools/call',{name,arguments:args},60000);}
async function getIncident(number){validNumber(number);const d=extract(await tool(TOOLS.details,{number}));if(!d?.number)throw Error('The details response did not contain an incident.');return d;}
async function load(number){await work(async()=>{const i=await getIncident(number);remember(i);S.review=null;S.draft={kind:'comments',text:''};S.view='overview';});}
async function search(){await work(async()=>{const i=S.incident;if(!i)throw Error('Open an incident first.');S.source=i;const query=[i.short_description,i.description,i.category,show(i.cmdb_ci)==='Not specified'?'':show(i.cmdb_ci)].filter(Boolean).join('. ').slice(0,1000);const d=extract(await tool(TOOLS.similar,{request_body:{incident_number:i.number,query,resolved_only:false}}));if(!Array.isArray(d.incident))throw Error('Expected the similarity response to contain an incident list.');S.records=d.incident;S.selected.clear();S.view='related';});}
function related(p){p.append(node('h1','Compare incident reports'),node('p','Similar symptoms can suggest a pattern. These records are not confirmed members of one outage.','notice'));if(S.source)p.append(node('p','Investigation source: '+S.source.number+' · '+S.source.short_description,'muted'));if(S.records===null){p.append(node('p','Run the similar-records tool to load results.'));return;}const toolbar=node('div',undefined,'toolbar'),filter=node('input'),state=node('select');filter.placeholder='Search within returned reports';filter.setAttribute('aria-label','Filter reports');for(const v of ['All states','New','In Progress','On Hold','Closed','Resolved']){const o=node('option',v);o.value=v;state.append(o);}state.setAttribute('aria-label','Filter by incident state');toolbar.append(filter,state);const count=node('p',undefined,'muted'),compare=node('div'),list=node('div',undefined,'results');p.append(toolbar,count,compare,list);
 function drawCompare(){compare.replaceChildren();if(!S.selected.size){compare.append(node('p','Select up to two reports to compare symptoms, teams, and resolution notes.','muted'));return;}const cols=node('div',undefined,'compare');for(const number of S.selected){const r=S.records.find(x=>x.number===number);if(!r)continue;const detail=S.details.get(number),a=node('article',undefined,'card');a.append(node('h3',number),node('p',r.short_description));facts(a,[['State',detail?.state||r.state],['Team',detail?.assignment_group||r.assignment_group_name]]);a.append(node('h3','Symptoms'),node('p',detail?.description||r.text||'No symptoms returned.'),node('h3','Resolution'),node('p',detail?.close_notes||r.close_notes||'No resolution notes recorded.'));cols.append(a);}compare.append(cols);}
 function draw(){list.replaceChildren();const q=filter.value.toLowerCase();const matches=S.records.filter(r=>[r.number,r.short_description,r.text].join(' ').toLowerCase().includes(q)&&(state.value==='All states'||show(r.state)===state.value));count.textContent=matches.length+' of '+S.records.length+' returned reports';if(!matches.length)list.append(node('p','No matching reports.'));for(const r of matches){const a=node('article',undefined,'card'),check=node('input');check.type='checkbox';check.checked=S.selected.has(r.number);check.setAttribute('aria-label','Compare '+r.number);check.disabled=S.busy;check.onchange=()=>{if(check.checked){if(S.selected.size>=2){check.checked=false;status('Select at most two reports. Deselect one to choose another.');return;}S.selected.add(r.number);}else S.selected.delete(r.number);drawCompare();};const label=node('label',undefined,'row');label.append(check,node('strong',r.number),node('span',show(r.state),'badge'));a.append(label,node('h3',r.short_description),node('p',r.text||'No additional symptoms returned.'));if(r.assignment_group_name)a.append(node('p','Assigned team: '+r.assignment_group_name,'muted'));disclosure(a,'Resolution notes',r.close_notes||'No resolution notes recorded.');a.append(button('Open full incident',()=>load(r.number)));list.append(a);}drawCompare();}filter.oninput=draw;state.onchange=draw;draw();}
function field(parent,title,input){const id='field-'+title.toLowerCase().replace(/[^a-z]+/g,'-');input.id=id;const l=node('label',title);l.htmlFor=id;parent.append(l,input);}
function buildDraft(){if(!S.incident)throw Error('Open an incident before preparing an update.');const text=S.draft.text;if(!text.trim())throw Error('Enter the update you want to submit.');if(text.length>4000)throw Error('Keep the update under 4,000 characters.');const body={};if(S.draft.kind==='assignment_group')body.assignment_group=text.trim();else body[S.draft.kind]=text;return {number:validNumber(S.incident.number),request_body:body};}
function actionForm(p){const i=S.incident;if(!i){p.append(node('h1','Open an incident before preparing an update.'));return;}p.append(node('h1','Prepare an incident update'),node('p',i.number+' · '+i.short_description,'muted'));if(S.writeLocks.has(i.number)){p.append(node('p','An update has already been submitted from this app for this incident. Review its response and verify the current record before starting another update.','notice'),button('View update response',()=>{S.view='receipt';render();}));return;}if(PREVIEW)p.append(node('p','Preview mode: writing is disabled.','notice'));
 if(S.review){const body=S.review.request_body;const labels={comments:'Customer-visible comment',work_notes:'Internal work note',assignment_group:'Assignment group'};p.append(node('h2','Review before saving'),node('p','Target incident: '+S.review.number));for(const[k,v]of Object.entries(body)){p.append(node('h3',labels[k]),node('p',v,'notice'));}p.append(node('p','Save sends this change to ServiceNow using your current access.','muted'));const a=node('div',undefined,'actions');a.append(button('Save update',save,true,PREVIEW),button('Edit draft',()=>{S.review=null;render();}));p.append(a);return;}
 const kind=node('select');for(const[k,label]of [['comments','Customer-visible comment'],['work_notes','Internal work note · IT staff only'],['assignment_group','Assign to an exact group name']]){const o=node('option',label);o.value=k;kind.append(o);}kind.value=S.draft.kind;kind.disabled=S.busy;kind.onchange=()=>{S.draft.kind=kind.value;S.draft.text='';render();};field(p,'Update type',kind);const text=S.draft.kind==='assignment_group'?node('input'):node('textarea');text.value=S.draft.text;text.maxLength=4000;text.disabled=S.busy;text.oninput=()=>S.draft.text=text.value;field(p,S.draft.kind==='assignment_group'?'Exact assignment group name':'Your update',text);p.append(node('p',S.draft.kind==='assignment_group'?'Enter a verified exact group name. This app does not guess a team from similarity results.':'The text will be submitted exactly as entered.','muted'));p.append(button('Review update',()=>{try{S.review=buildDraft();$('error').textContent='';render();}catch(e){fail(e);}},true));}
function receiptSummary(d){const strings=[];for(const key of ['message','status_message','detail'])if(typeof d?.[key]==='string')strings.push(cleanText(d[key]));return strings.join('\n')||'The tool returned a response. Use Verify current record to check the saved fields.';}
function receipt(p){const r=S.receipt;p.append(node('h1','Incident update response'));if(!r){p.append(node('p','A response will appear here after the modify tool runs. No change is submitted when this app opens.','notice'));return;}const a=node('div',undefined,'receipt');a.append(node('h2',r.failed?'Update not confirmed':r.uncertain?'Outcome needs checking':'Tool response received'));if(r.number)a.append(node('strong',r.number));a.append(node('p',r.summary));if(r.payload)for(const[k,v]of Object.entries(r.payload.request_body))a.append(node('p',({comments:'Submitted comment',work_notes:'Submitted work note',assignment_group:'Requested group'}[k]||k)+': '+v));if(r.verification){a.append(node('h3','Verification'),node('p',r.verification));}p.append(a);if(r.number){const actions=node('div',undefined,'actions');actions.append(button('Verify current record',verify,true),button('Open incident',()=>load(r.number)));p.append(actions);}else p.append(node('p','The response did not identify an incident. Invoke the details tool with its exact incident number to verify it.','muted'));}
async function save(){if(S.busy||!S.review)return;if(PREVIEW){fail(Error('Writing is disabled in preview mode.'));return;}const payload=structuredClone(S.review);if(S.writeLocks.has(payload.number))return;S.writeLocks.add(payload.number);S.busy=true;$('error').textContent='';status('Submitting your update…');render();
 try{const r=await tool(TOOLS.modify,payload);const d=extract(r);S.receipt={number:payload.number,payload,summary:receiptSummary(d),uncertain:false};S.review=null;S.draft.text='';status('Response received. Verify the current record.');}
 catch(e){S.receipt={number:payload.number,payload,summary:cleanText(e.message||String(e))+'\nDo not resubmit without checking ServiceNow; the operation may have completed.',uncertain:true};status('Check the saved incident before taking another action.');}
 finally{S.busy=false;S.view='receipt';render();}
}
async function verify(){const r=S.receipt;if(!r?.number)return;await work(async()=>{const i=await getIncident(r.number);S.details.set(i.number,i);if(sameIncident(i))S.incident=i;const results=[];const b=r.payload?.request_body;if(b?.assignment_group)results.push(show(i.assignment_group)===b.assignment_group?'Assignment group matches the requested value.':'Assignment group does not match the requested value.');for(const key of ['comments','work_notes'])if(b?.[key])results.push((i.activity||'').includes(b[key])?'Submitted text is present in the returned recent activity.':'Submitted text was not found in the returned recent activity. The feed may be limited or restricted by your access.');if(!results.length)results.push('Current record retrieved. State: '+show(i.state)+'. Assignment group: '+show(i.assignment_group)+'.');r.verification=results.join('\n');S.view='receipt';},'Reading the saved record…');}
function consumeInput(args){S.input=args||{};}
function acceptInitial(response){if(LANDING==='receipt'){try{const d=extract(response);const n=S.input.number||d?.number||d?.incident?.number;S.receipt={number:/^INC\d+$/.test(n||'')?n:null,payload:S.input.number&&S.input.request_body?S.input:null,summary:receiptSummary(d)};}catch(e){S.receipt={number:S.input.number||null,summary:cleanText(e.message||String(e)),failed:true};}S.view='receipt';render();return;}const d=extract(response);if(d?.number){remember(d,true);S.view='overview';}else if(Array.isArray(d?.incident)){S.records=d.incident;S.selected.clear();S.view='related';}else throw Error('The tool response did not contain incident details or similar incidents.');status('Evidence loaded');render();}
// Offline previews only. Live views never default to these records.
const PREVIEW_INCIDENT={number:'INC0009005',short_description:'Email server is down.',description:'Unable to send or receive emails.',state:{display_value:'New'},priority:{display_value:'1 - Critical'},category:'software',subcategory:'email',caller_id:{display_value:'David Miller'},opened_at:'2018-09-01 04:35:21',assignment_group:{display_value:''},assigned_to:{display_value:''},cmdb_ci:{display_value:''},activity:'2018-12-12 23:18:42 - System Administrator (Work notes)\nUpdated the priority based on incident criticality.'};
const PREVIEW_RECORDS=[{number:'INC0000032',short_description:'EMAIL Server Down Again',state:'Closed',assignment_group_name:'Hardware',text:'Multiple employees have reported that they are unable to send/receive email.',close_notes:'Closed before close notes were made mandatory'},{number:'INC0000050',short_description:"Can't access Exchange server - is it down?",state:'In Progress',assignment_group_name:'Hardware',text:"Can't connect to Exchange. Login credentials and network connection are working though.",close_notes:''},{number:'INC0000039',short_description:'Trouble getting to Oregon mail server',state:'New',assignment_group_name:'Network',text:'Unable to access Oregon mail server. Is it down?',close_notes:''},{number:'INC0000058',short_description:'Performance problems with email',state:'New',assignment_group_name:'',text:"Taking a really long time to send emails. Last email took almost a minute for sending to complete and there wasn't even an attachment.",close_notes:''}];
async function mock(name,args){if(name===TOOLS.modify)throw Error('Writing is disabled in preview mode.');if(name===TOOLS.similar)return {structuredContent:{result:{incident:structuredClone(PREVIEW_RECORDS)}}};const n=args.number;if(n===PREVIEW_INCIDENT.number)return {structuredContent:{result:structuredClone(PREVIEW_INCIDENT)}};const r=PREVIEW_RECORDS.find(x=>x.number===n);if(!r)throw Error('That record is not included in the offline preview.');return {structuredContent:{result:{...r,description:r.text,assignment_group:{display_value:r.assignment_group_name},priority:{display_value:'Not loaded in preview'}}}};}

let rpcId=0,parentOrigin='*';const pending=new Map();
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},parentOrigin);}
function rpc(method,params,timeout=30000){return new Promise((resolve,reject)=>{const id=++rpcId;const timer=setTimeout(()=>{pending.delete(id);reject(Error('The MCP host did not respond to '+method+'.'));},timeout);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},parentOrigin);});}
