<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident update confirmation</title><style>
:root{color-scheme:light dark;--bg:#fff;--ink:#19392e;--muted:#68786f;--line:#dce7df;--soft:#f3f7f4;--accent:#176a49;--error:#b32f3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}main{padding:26px;max-width:850px;margin:auto}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.badge{font-size:12px;border:1px solid var(--line);border-radius:25px;padding:4px 10px;background:var(--soft)}h1{font-size:27px;line-height:1.2;margin:12px 0}h2{font-size:17px}p{white-space:pre-wrap;overflow-wrap:anywhere}.hero{border:1px solid var(--line);border-radius:14px;padding:23px;margin-top:20px}.icon{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px}.success{color:var(--accent)}.failed{color:var(--error)}.muted,small{color:var(--muted)}.comment{border-left:3px solid var(--accent);background:var(--soft);border-radius:6px;padding:16px;margin:12px 0}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fact{padding:12px;border:1px solid var(--line);border-radius:9px;overflow-wrap:anywhere}.fact small,.fact strong{display:block}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,input,textarea{font:inherit}button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.5;cursor:default}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}textarea{min-height:110px;resize:vertical}label{display:block;margin:14px 0 6px}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #83b49c;outline-offset:3px}details{border-top:1px solid var(--line);padding:14px 0;margin-top:15px}summary{cursor:pointer;font-weight:600}#status{min-height:24px;margin-top:12px;color:var(--muted)}#error{color:var(--error);white-space:pre-wrap}.verify{background:var(--soft);padding:15px;border-radius:9px;margin-top:18px}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px;margin-top:25px}@media(max-width:500px){main{padding:17px}.hero{padding:17px}.facts{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#14241c;--ink:#e4eee7;--muted:#a8b8ad;--line:#354c3d;--soft:#21392b;--accent:#64bd91;--error:#ff9cab}button.primary{background:#226b49;border-color:#226b49;color:white}}
</style></head><body><main>
<header class="row top"><div class="eyebrow">Service operations / Update confirmation</div><span class="badge" id="connection">Connecting</span></header>
<div id="status" role="status" aria-live="polite">Waiting for the update result…</div><div id="error" role="alert"></div><section id="view" aria-label="Incident update confirmation"></section>
<footer>Updates use your ServiceNow permissions. Verification reads the current record. Opening this app never repeats the update.</footer>
</main><script>
'use strict';
const TOOLS={details:'get_incident_details__copy',modify:'modify_incident__copy'};
const $=id=>document.getElementById(id);
let input={},result=null,resultError=null,connected=false,busy=false,verification=null,detail=null,editor=false,draft='',review=null,writeLocked=false;
let rpcId=0,parentOrigin='*';const pending=new Map();
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function show(v){return v&&typeof v==='object'?(v.display_value||'Not specified'):(v||'Not specified');}
function safe(t){return String(t).replace(/\b[0-9a-f]{32}\b/gi,'[internal identifier]');}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},parentOrigin);}
function rpc(method,params,ms=30000){return new Promise((resolve,reject)=>{const id=++rpcId,timer=setTimeout(()=>{pending.delete(id);reject(Error('The MCP host did not respond.'));},ms);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},parentOrigin);});}
function unpack(r){if(r?.isError)throw Error(safe(r.content?.filter(p=>p.type==='text').map(p=>p.text).join('\n')||'The update request failed.'));let d=r?.structuredContent;if(d==null)for(const p of r?.content??[]){if(p.type==='text')try{d=JSON.parse(p.text);break;}catch{}}if(d==null)throw Error('The tool did not return a JSON result.');for(let i=0;i<6&&d?.result!==undefined;i++)d=d.result;if(d?.success===false||d?.error)throw Error(safe(d.message||d.error?.message||d.error||'The request was rejected.'));return d;}
function number(){const n=input.number||result?.number||result?.incident?.number;return /^INC\d+$/.test(n||'')?n:null;}
function fields(){return Array.isArray(result?.updated_fields)?result.updated_fields.filter(x=>typeof x==='string'):[];}
function confirmed(){return !resultError&&(result?.status==='updated'||result?.success===true);}
function heading(){if(resultError)return 'Update not confirmed';if(!result)return 'Waiting for update result';if(!confirmed())return 'Update response received';const f=fields();if(f.length===1&&f[0]==='comments')return 'Comment added';if(f.length===1&&f[0]==='work_notes')return 'Work note added';if(f.length===1&&f[0]==='assignment_group')return 'Assignment updated';return 'Incident updated';}
const labels={comments:'Customer-visible comment',work_notes:'Internal work note',assignment_group:'Assignment group',assigned_to:'Assigned to',state:'State',close_code:'Resolution code',close_notes:'Resolution notes',urgency:'Urgency'};
function button(label,fn,primary=false){const b=el('button',label,primary?'primary':'');b.disabled=busy||!connected;b.onclick=fn;return b;}
function note(parent,title,text){const d=el('details');d.append(el('summary',title),el('p',text));parent.append(d);}
function render(){const v=$('view');v.replaceChildren();const hero=el('div',undefined,'hero');hero.append(el('div',confirmed()?'✓':resultError?'!':'…','icon '+(confirmed()?'success':resultError?'failed':'')),el('h1',heading()));const n=number();if(n)hero.append(el('strong',n));if(confirmed())hero.append(el('p','ServiceNow confirmed the update.','success'));if(resultError)hero.append(el('p',resultError,'failed'));if(result&&!confirmed()&&!resultError)hero.append(el('p',safe(result.message||'The response did not explicitly confirm a saved update. Read the incident to check its current values.'),'muted'));
 const f=fields();if(f.length){const badges=el('div',undefined,'row');for(const k of f)badges.append(el('span',labels[k]||'Updated field','badge'));hero.append(badges);}
 if(confirmed()&&f.includes('comments')){if(typeof input.request_body?.comments==='string'){hero.append(el('h2','Saved comment'),el('p',input.request_body.comments,'comment'));}else hero.append(el('p','The comment was saved. Its text was not included in the data delivered to this app.','muted'));}
 if(confirmed()&&f.includes('work_notes')&&typeof input.request_body?.work_notes==='string')hero.append(el('h2','Submitted internal note'),el('p',input.request_body.work_notes,'comment'));
 if(confirmed()&&f.includes('assignment_group')&&input.request_body?.assignment_group&&!/^[a-f0-9]{32}$/i.test(input.request_body.assignment_group))hero.append(el('p','Requested group: '+input.request_body.assignment_group));
 if(result?.incident_state){const facts=el('div',undefined,'facts'),a=el('div',undefined,'fact');a.append(el('small','Incident state after update'),el('strong',show(result.incident_state)));facts.append(a);hero.append(facts);}v.append(hero);
 if(!n&&(result||resultError)){const l=el('label','Incident number for verification');l.htmlFor='incident-number';const entry=el('input');entry.id='incident-number';entry.placeholder='For example, INC0009005';const b=button('Use this incident number',()=>{if(!/^INC\d+$/.test(entry.value.trim())){$('error').textContent='Enter an exact incident number.';return;}input.number=entry.value.trim();verification=null;render();});v.append(l,entry,b,el('p','The tool response omitted the incident number. Enter the original target to verify that record.','muted'));}
 if(n&&(result||resultError)){const actions=el('div',undefined,'actions');actions.append(button('Verify saved update',verify,true),button('View current incident',()=>verify(true)));if(confirmed()&&!writeLocked)actions.append(button('Add follow-up comment',()=>{editor=!editor;review=null;render();}));v.append(actions);}
 if(verification){const panel=el('div',undefined,'verify');panel.append(el('h2','Verification'),el('p',verification));v.append(panel);}
 if(detail){const d=el('details');d.open=true;d.append(el('summary',detail.number+' · '+detail.short_description));const facts=el('div',undefined,'facts');for(const[k,val]of [['State',detail.state],['Priority',detail.priority],['Assigned team',detail.assignment_group]]){const a=el('div',undefined,'fact');a.append(el('small',k),el('strong',show(val)));facts.append(a);}d.append(facts);note(d,'Recent comments and work notes',detail.activity?.trim()||'No recent activity returned.');v.append(d);}
 if(editor&&n&&!writeLocked){const form=el('div',undefined,'hero');form.append(el('h2','Add a follow-up comment'),el('p','This will be visible to the requester.','muted'));if(review){form.append(el('p','Target: '+n),el('p',review,'comment'),button('Save comment',saveFollowup,true),button('Edit',()=>{review=null;render();}));}else{const l=el('label','Your comment');l.htmlFor='followup';const area=el('textarea');area.id='followup';area.maxLength=4000;area.value=draft;area.disabled=busy;area.oninput=()=>draft=area.value;form.append(l,area,button('Review comment',()=>{if(!draft.trim()){$('error').textContent='Enter a comment first.';return;}if(draft.length>4000){$('error').textContent='Use at most 4,000 characters.';return;}review=draft;$('error').textContent='';render();},true));}v.append(form);}
}
async function verify(expand=false){if(busy||!number())return;const n=number(),body=input.request_body||{};busy=true;$('error').textContent='';$('status').textContent='Reading the saved incident…';render();try{const d=unpack(await rpc('tools/call',{name:TOOLS.details,arguments:{number:n}},60000));if(d?.number!==n)throw Error('The returned record did not match the requested incident.');const checks=[];for(const k of ['comments','work_notes'])if(typeof body[k]==='string')checks.push((d.activity||'').includes(body[k])?'Submitted '+(k==='comments'?'comment':'work note')+' found in the returned recent activity.':'Submitted '+(k==='comments'?'comment':'work note')+' not found in the returned recent activity. The feed may be limited or restricted.');if(body.assignment_group&&!/^[a-f0-9]{32}$/i.test(body.assignment_group))checks.push(show(d.assignment_group)===body.assignment_group?'Assignment group matches the requested group.':'Assignment group differs from the requested group.');verification=checks.join('\n')||'Current incident read successfully. No submitted text or comparable group name was available for an exact match.';if(expand)detail=d;$('status').textContent='Current record retrieved.';}catch(e){$('error').textContent=safe(e.message||String(e));$('status').textContent='Verification could not be completed.';}finally{busy=false;render();}}
async function saveFollowup(){if(busy||writeLocked||!review||!number())return;const n=number(),text=review;writeLocked=true;busy=true;$('error').textContent='';$('status').textContent='Saving follow-up comment…';render();try{const r=await rpc('tools/call',{name:TOOLS.modify,arguments:{number:n,request_body:{comments:text}}},60000);const d=unpack(r);input={number:n,request_body:{comments:text}};result=d;resultError=null;verification=null;detail=null;editor=false;review=null;draft='';$('status').textContent='Follow-up response received.';}catch(e){result=null;resultError=safe(e.message||String(e))+' The outcome needs checking before any retry.';editor=false;review=null;$('status').textContent='Read the incident before submitting another update.';}finally{busy=false;render();}}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;if(parentOrigin!=='*'&&event.origin!==parentOrigin)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id!==undefined&&!m.method&&pending.has(m.id)){if(parentOrigin==='*'&&event.origin&&event.origin!=='null')parentOrigin=event.origin;const p=pending.get(m.id);clearTimeout(p.timer);pending.delete(m.id);if(m.error)p.reject(Error(m.error.message||'Host rejected request.'));else p.resolve(m.result);return;}if((m.method==='ping'||m.method==='ui/resource-teardown')&&m.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},parentOrigin);return;}if(m.method==='ui/notifications/tool-input'){input=m.params?.arguments||{};render();}if(m.method==='ui/notifications/tool-result'){try{result=unpack(m.params);resultError=null;$('status').textContent='Update result received.';}catch(e){result=null;resultError=safe(e.message||String(e));$('status').textContent='The update was not confirmed.';}verification=null;detail=null;render();}});
let lastHeight=0;if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>{if(!connected)return;const height=Math.ceil(document.querySelector('main').getBoundingClientRect().height);if(lastHeight!==height){lastHeight=height;notify('ui/notifications/size-changed',{height});}}).observe(document.querySelector('main'));
if(window.parent===window){$('connection').textContent='Standalone';$('status').textContent='Attach this HTML to modify_incident__copy and invoke that tool to see its real update result.';render();}else{render();rpc('ui/initialize',{appInfo:{name:'incident-update-confirmation',version:'2.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{connected=true;$('connection').textContent='Connected';notify('ui/notifications/initialized',{});render();}).catch(e=>{$('connection').textContent='Connection failed';$('error').textContent=safe(e.message||String(e));});}
</script></body></html>
